name: Lean verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Show pinned toolchain
        run: |
          lean --version
          lake --version
      - name: Materialize pinned dependencies
        run: lake update
      - name: Fetch mathlib cache
        continue-on-error: true
        run: lake exe cache get
      - name: Build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          lake build 2>&1 | tee build.log
      - name: Check theorem entry point
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          lake env lean JSP000812.lean 2>&1 | tee endpoint.log
      - name: Axiom audit
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -o pipefail
          lake env lean Audit.lean 2>&1 | tee audit.log
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lean-verification-logs
          path: |
            build.log
            endpoint.log
            audit.log
      - name: Enforce successful build
        if: steps.build.outcome != 'success'
        run: exit 1
